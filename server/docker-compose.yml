services:
  db:
    image: postgres:17
    container_name: mosaic-research
    restart: always
    environment:
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic123
      POSTGRES_DB: mosaicdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaicdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
